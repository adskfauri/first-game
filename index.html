<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>칼퇴 서바이벌: 버그 지옥</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="game-container">
        <section class="game-header">
            <div>
                <p class="eyebrow">OFFICE ESCAPE GAME</p>
                <h1>칼퇴 서바이벌</h1>
                <p class="subtitle">화면을 누른 채 캐릭터를 움직여 버그를 피하고 100점을 달성하세요.</p>
            </div>

            <div class="legend" aria-label="게임 아이템 안내">
                <span>☕ 속도 증가</span>
                <span>🛡️ 1회 방어</span>
                <span>💣 장애물 제거</span>
            </div>
        </section>

        <section class="game-stage">
            <canvas id="gameCanvas" width="600" height="760"></canvas>

            <div class="touch-controls">
                <button type="button" id="leftButton" class="control-button">◀</button>
                <button type="button" id="rightButton" class="control-button">▶</button>
            </div>
        </section>

        <div class="actions">
            <button type="button" id="restartButton" class="restart-button">다시 도전하기</button>
            <p>PC: 방향키 또는 WASD · 모바일: 화면을 꾹 누르고 드래그</p>
        </div>
    </main>

    <script src="./game.js"></script>
</body>
</html>

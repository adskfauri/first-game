<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>칼퇴 서바이벌: 버그 지옥</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="game-container">
        <section class="game-header">
            <div>
                <p class="eyebrow">OFFICE ESCAPE GAME</p>
                <h1>칼퇴 서바이벌</h1>
                <p class="subtitle">화면을 누른 채 캐릭터를 움직여 버그를 피하고 100점을 달성하세요.</p>
            </div>

            <div class="legend" aria-label="게임 아이템 안내">
                <span>☕ 속도 증가</span>
                <span>🛡️ 1회 방어</span>
                <span>💣 장애물 제거</span>
            </div>
        </section>

        <section class="game-stage">
            <canvas id="gameCanvas" width="600" height="760"></canvas>

            <div class="touch-controls">
                <button type="button" id="leftButton" class="control-button">◀</button>
                <button type="button" id="rightButton" class="control-button">▶</button>
            </div>
        </section>
        <div id="targetScoreModal" class="target-score-modal">
    <div class="target-score-panel">
        <p class="target-score-eyebrow">오늘의 퇴근 목표</p>
        <h2>몇 점에서 퇴근할까요?</h2>

        <div class="score-guide">
            <button type="button" class="score-option" data-score="100">
                <strong>100점</strong>
                <span>짧게 즐기는 수준</span>
            </button>

            <button type="button" class="score-option" data-score="200">
                <strong>200점</strong>
                <span>적당히 긴장감 있음</span>
            </button>

            <button type="button" class="score-option recommended" data-score="300">
                <strong>300점</strong>
                <span>꽤 오래 버텨야 함</span>
                <em>추천</em>
            </button>

            <button type="button" class="score-option" data-score="500">
                <strong>500점</strong>
                <span>제대로 어려운 칼퇴 도전</span>
            </button>
        </div>

        <p class="target-score-help">
            목표 점수를 달성하면 자동으로 퇴근합니다 🎉
        </p>
    </div>
</div>

        <div class="actions">
            <button type="button" id="restartButton" class="restart-button">다시 도전하기</button>
            <p>PC: 방향키 또는 WASD · 모바일: 화면을 꾹 누르고 드래그</p>
        </div>
    </main>

    <script src="./game.js"></script>
</body>
</html>
